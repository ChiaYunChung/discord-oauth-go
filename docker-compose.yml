version: '3.8'
services:
  sso-broker:
    image: discord-oauth-go:latest
    container_name: discord-oauth-go
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./config.yaml:/root/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3